; LW18 dimmer - XIAO ESP32-C6 + LED-Warrior18
; Details: README.md

[env:xiao_esp32c6]
; pioarduino 55.03.31 = Arduino core 3.3.1 (>= 3.3.x required for ZigbeeMultistate)
; Fixed version instead of "stable": reproducible (tested with PIO Core 6.1.18 from the pioarduino IDE)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200

; Zigbee router (permanently powered -> strengthens the mesh)
board_build.partitions = zigbee_zczr.csv
build_flags =
    -D ZIGBEE_MODE_ZCZR
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Zigbee stack libraries (the Arduino IDE sets these via the board menu)
    -lesp_zb_api.zczr
    -lzboss_stack.zczr
    -lzboss_port.native

lib_deps =
    lennarthennigs/Button2
